<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Noise Hub — Cinematic Promo Director</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #06080c;
    color: #fff;
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    position: relative;
    user-select: none;
  }

  /* Centered 1920x1080 Stage Auto-Scaler */
  #scalerStage {
    position: absolute;
    width: 1920px;
    height: 1080px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    overflow: hidden;
    background: #06080c;
  }

  /* 3D Camera Rig holding the real site views */
  #cameraRig {
    position: absolute;
    inset: 0;
    z-index: 5;
    perspective: 1600px;
    transform-style: preserve-3d;
  }

  #cameraView {
    position: absolute;
    inset: 0;
    transform-origin: center center;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s ease;
  }

  /* Frames Container */
  .site-frame-wrap {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  iframe.site-frame {
    width: 1920px;
    height: 1080px;
    border: none;
    background: #0a0a0a;
    display: block;
    pointer-events: auto;
  }

  #frameLandingWrap {
    opacity: 1;
    transform: scale(1);
    z-index: 10;
  }

  #frameAppWrap {
    opacity: 0;
    transform: scale(1.04);
    z-index: 9;
    pointer-events: none;
  }

  /* Special Effects Overlay Layer */
  #fxLayer {
    position: absolute;
    inset: 0;
    z-index: 30;
    pointer-events: none;
  }

  /* Subtle Scanlines & Vignette matching the site */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.1),
      rgba(0, 0, 0, 0.1) 2px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
    opacity: 0.45;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 55%, rgba(6, 8, 12, 0.6) 88%, #06080c 100%);
    pointer-events: none;
  }

  /* Laser Scanner Beam */
  .laser-scanner {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, #0066ff 20%, #00ff88 50%, #0066ff 80%, transparent 100%);
    box-shadow: 0 0 16px #00ff88, 0 0 32px #0066ff;
    top: -10px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .laser-scanner.scanning {
    opacity: 1;
    animation: laserSweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes laserSweep {
    0% { top: 0%; opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  /* Native Terminal-Style Status Pill in Bottom Left (Matches site's monospace aesthetic) */
  .terminal-status-pill {
    position: absolute;
    bottom: 28px;
    left: 36px;
    background: rgba(13, 17, 23, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-left: 3px solid #00ff88;
    padding: 10px 20px;
    border-radius: 6px;
    font-family: 'Space Grotesk', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(12px);
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .terminal-status-pill.show {
    opacity: 1;
    transform: translateY(0);
  }
  .pill-dot {
    width: 7px;
    height: 7px;
    background: #00ff88;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ff88;
    animation: liveP 1.2s infinite;
  }
  @keyframes liveP {
    0% { opacity: 0.5; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0.5; transform: scale(0.8); }
  }

  /* Targeting Focus Frame (Subtle Neon Box Highlighting Feature in focus) */
  #targetFrame {
    position: absolute;
    border: 1px solid rgba(0, 255, 136, 0.4);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.15), inset 0 0 20px rgba(0, 102, 255, 0.08);
    border-radius: 8px;
    opacity: 0;
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  #targetFrame.active {
    opacity: 1;
  }

  /* Virtual Animated Neon Cursor */
  #virtualCursor {
    position: absolute;
    width: 24px;
    height: 24px;
    z-index: 100;
    pointer-events: none;
    transform: translate(-2px, -2px);
    display: none;
  }
  #virtualCursor svg {
    width: 24px;
    height: 24px;
    filter: drop-shadow(0 0 10px #00ff88);
  }
  .cursor-ripple {
    position: absolute;
    width: 60px;
    height: 60px;
    border: 2px solid #00ff88;
    border-radius: 50%;
    top: -28px;
    left: -28px;
    opacity: 0;
    transform: scale(0.2);
    pointer-events: none;
  }
  .cursor-ripple.click {
    animation: rip 0.6s ease-out forwards;
  }
  @keyframes rip {
    0% { transform: scale(0.2); opacity: 1; border-color: #00ff88; }
    100% { transform: scale(1.7); opacity: 0; border-color: #0066ff; }
  }

  /* Hyperdrive Warp Transition FX */
  #warpOverlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0, 102, 255, 0.85) 0%, rgba(0, 255, 136, 0.6) 35%, rgba(6, 8, 12, 0.95) 100%);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    transition: opacity 0.4s ease;
  }
  #warpOverlay.active {
    opacity: 1;
  }

  /* Minimalist Technical Outro Bar (Matching Site's Real Theme) */
  #outroBar {
    position: absolute;
    bottom: 36px;
    left: 48px;
    right: 48px;
    background: rgba(10, 14, 22, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 102, 255, 0.2);
    backdrop-filter: blur(14px);
    z-index: 70;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #outroBar.show {
    opacity: 1;
    transform: translateY(0);
  }
  .outro-left {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .outro-link-btn {
    background: #0066ff;
    color: #fff;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 6px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 25px rgba(0, 102, 255, 0.6);
  }
</style>
</head>
<body>

<div id="scalerStage">

  <!-- 3D Camera Rig -->
  <div id="cameraRig">
    <div id="cameraView">

      <!-- Frame A: Landing Page -->
      <div class="site-frame-wrap" id="frameLandingWrap">
        <iframe class="site-frame" id="frameLanding" src="/index.html"></iframe>
      </div>

      <!-- Frame B: Web App -->
      <div class="site-frame-wrap" id="frameAppWrap">
        <iframe class="site-frame" id="frameApp" src="/app.html"></iframe>
      </div>

    </div>
  </div>

  <!-- Special Effects Overlays -->
  <div id="fxLayer">
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="laser-scanner" id="laserScanner"></div>
    <div id="targetFrame"></div>

    <!-- Minimalist Status Pill in Bottom-Left -->
    <div class="terminal-status-pill" id="statusPill">
      <div class="pill-dot"></div>
      <span id="statusText">NOISE HUB // SUI TERMINAL</span>
    </div>

    <!-- Virtual Cursor -->
    <div id="virtualCursor">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5.5 3.2L18.8 12.3C19.7 12.9 19.3 14.3 18.2 14.4L13.1 14.8L16.2 20.3C16.6 21 16.1 21.9 15.3 21.9L12.5 21.9C12 21.9 11.5 21.6 11.3 21.1L8.3 15.4L4.8 19.1C4 20 2.5 19.4 2.5 18.2L2.5 4.5C2.5 3.4 3.8 2.7 4.7 3.4L5.5 3.2Z" fill="#00ff88" stroke="#003311" stroke-width="1.5"/>
      </svg>
      <div class="cursor-ripple" id="cursorRipple"></div>
    </div>

    <!-- Warp Speed / Glitch Transition Overlay -->
    <div id="warpOverlay"></div>

    <!-- Sleek Native Outro Bar (No intrusive popups) -->
    <div id="outroBar">
      <div class="outro-left">
        <span style="color:#00ff88;">⚡ NOISE HUB</span>
        <span style="color:#64748b; font-weight:400; font-size:16px;">// UNIFIED NON-CUSTODIAL SUI SUITE</span>
      </div>
      <div style="font-size:14px; color:#94a3b8; font-family:'Space Grotesk', monospace;">
        SWAP · BRIDGE · SPOT CLOB · PREDICT · FLASH-FLOW
      </div>
      <a href="https://noisesui.vercel.app/" class="outro-link-btn">
        <span>https://noisesui.vercel.app/</span>
        <span>↗</span>
      </a>
    </div>

  </div>
</div>

<script>
// Auto-scale 1920x1080 stage to fit current window perfectly
function resizeStage() {
  const stage = document.getElementById('scalerStage');
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  const scale = Math.min(winW / 1920, winH / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener('resize', resizeStage);
resizeStage();

// Master Helpers
const wait = ms => new Promise(r => setTimeout(r, ms));
const cameraView = document.getElementById('cameraView');
const frameLanding = document.getElementById('frameLanding');
const frameApp = document.getElementById('frameApp');
const frameLandingWrap = document.getElementById('frameLandingWrap');
const frameAppWrap = document.getElementById('frameAppWrap');
const virtualCursor = document.getElementById('virtualCursor');
const cursorRipple = document.getElementById('cursorRipple');
const statusPill = document.getElementById('statusPill');
const statusText = document.getElementById('statusText');
const targetFrame = document.getElementById('targetFrame');
const laserScanner = document.getElementById('laserScanner');
const warpOverlay = document.getElementById('warpOverlay');
const outroBar = document.getElementById('outroBar');

// Cursor Movement
let curX = 960, curY = 540;
function moveCursor(x, y, duration = 750) {
  virtualCursor.style.display = 'block';
  virtualCursor.style.transition = `top ${duration}ms cubic-bezier(0.2, 0.8, 0.2, 1), left ${duration}ms cubic-bezier(0.2, 0.8, 0.2, 1)`;
  virtualCursor.style.top = y + 'px';
  virtualCursor.style.left = x + 'px';
  curX = x; curY = y;
  return wait(duration);
}

function clickCursor() {
  cursorRipple.classList.remove('click');
  void cursorRipple.offsetWidth;
  cursorRipple.classList.add('click');
  return wait(300);
}

// Camera Motion
function setCamera(scale = 1, x = 0, y = 0, rotateX = 0, rotateY = 0, duration = 800) {
  cameraView.style.transition = `transform ${duration}ms cubic-bezier(0.16, 1, 0.3, 1)`;
  cameraView.style.transform = `scale(${scale}) translate3d(${x}px, ${y}px, 0px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
  return wait(duration);
}

// Set Status Pill
function setStatus(text) {
  statusText.textContent = text;
  statusPill.classList.add('show');
}
function hideStatus() {
  statusPill.classList.remove('show');
}

// Set Target Highlight Box
function highlightBox(x, y, w, h) {
  targetFrame.style.left = (x - 10) + 'px';
  targetFrame.style.top = (y - 10) + 'px';
  targetFrame.style.width = (w + 20) + 'px';
  targetFrame.style.height = (h + 20) + 'px';
  targetFrame.classList.add('active');
}
function clearHighlight() {
  targetFrame.classList.remove('active');
}

// Ensure iframes are loaded before starting
window.iframesReady = new Promise(resolve => {
  let count = 0;
  const check = () => { count++; if (count >= 2) resolve(true); };
  if (frameLanding.contentDocument && frameLanding.contentDocument.readyState === 'complete') check();
  else frameLanding.onload = check;
  if (frameApp.contentDocument && frameApp.contentDocument.readyState === 'complete') check();
  else frameApp.onload = check;
});

// Master Promo Timeline
window.playPromoTimeline = async function() {
  await window.iframesReady;
  const lWin = frameLanding.contentWindow;
  const appDoc = frameApp.contentDocument;
  const appWin = frameApp.contentWindow;

  // Reset to initial state
  if (lWin) lWin.scrollTo(0, 0);
  frameLandingWrap.style.opacity = '1';
  frameLandingWrap.style.pointerEvents = 'auto';
  frameAppWrap.style.opacity = '0';
  frameAppWrap.style.pointerEvents = 'none';
  outroBar.classList.remove('show');
  virtualCursor.style.display = 'none';
  clearHighlight();
  await setCamera(1, 0, 0, 0, 0, 100);

  // ----------------------------------------------------
  // SCENE 1: LANDING PAGE HERO (0s - 4.5s)
  // ----------------------------------------------------
  laserScanner.classList.add('scanning');
  setStatus('NOISE HUB // SUI WITHOUT THE NOISE');
  await moveCursor(960, 420, 800);
  await setCamera(1.03, 0, -10, 0, 0, 1000);
  await wait(2400);

  // ----------------------------------------------------
  // SCENE 2: SCROLL DOWN LANDING PAGE (4.5s - 9.0s)
  // ----------------------------------------------------
  setStatus('MULTI-DEX AGGREGATION · CETUS · AFTERMATH · TURBOS · FLOWX');
  if (lWin) {
    lWin.scrollTo({ top: 700, behavior: 'smooth' });
  }
  await setCamera(1.04, 0, -35, 1.5, 0, 1100);
  await moveCursor(720, 520, 850);
  await wait(1800);

  if (lWin) {
    lWin.scrollTo({ top: 1500, behavior: 'smooth' });
  }
  await moveCursor(1100, 480, 800);
  await wait(1600);

  // ----------------------------------------------------
  // SCENE 3: TARGET & CLICK "OPEN APP" (9.0s - 12.0s)
  // ----------------------------------------------------
  if (lWin) {
    lWin.scrollTo({ top: 0, behavior: 'smooth' });
  }
  await setCamera(1.12, -260, 140, 0, 0, 750);
  setStatus('CONNECTING TO ON-CHAIN EXECUTION TERMINAL...');
  
  await moveCursor(1802, 38, 750);
  await clickCursor();
  await wait(350);

  // ----------------------------------------------------
  // SCENE 4: WARP TRANSITION TO APP (12.0s - 13.5s)
  // ----------------------------------------------------
  warpOverlay.classList.add('active');
  await setCamera(1.3, 0, 0, 0, 0, 450);
  await wait(350);

  frameLandingWrap.style.opacity = '0';
  frameLandingWrap.style.pointerEvents = 'none';
  frameAppWrap.style.opacity = '1';
  frameAppWrap.style.pointerEvents = 'auto';
  frameAppWrap.style.transform = 'scale(1)';

  await wait(250);
  warpOverlay.classList.remove('active');
  await setCamera(1.0, 0, 0, 0, 0, 600);
  await wait(300);

  // ----------------------------------------------------
  // SCENE 5: APP - SWAP AGGREGATOR (13.5s - 17.5s)
  // ----------------------------------------------------
  setStatus('SWAP & ROUTING // ZERO MEV SLIPPAGE');
  await setCamera(1.06, 0, -15, 0, 0, 700);
  await moveCursor(960, 460, 800); // Hover swap card
  highlightBox(680, 240, 560, 420);
  await wait(2200);
  clearHighlight();

  // ----------------------------------------------------
  // SCENE 6: APP - CROSS-CHAIN BRIDGE (17.5s - 23.5s)
  // ----------------------------------------------------
  // Click "CROSS-CHAIN BRIDGE" filter button
  setStatus('CROSS-CHAIN BRIDGE // ETHEREUM ➔ SUI NETWORK');
  await moveCursor(478, 237, 700);
  await clickCursor();
  if (appWin && typeof appWin.setSwapViewMode === 'function') {
    appWin.setSwapViewMode('bridge');
  } else if (appDoc) {
    const btnB = appDoc.getElementById('modeBtnBridge');
    if (btnB) btnB.click();
  }
  await wait(500);

  // Zoom onto Bridge inputs and routes
  await setCamera(1.14, -60, -30, 0, 0, 800);
  highlightBox(280, 260, 620, 500);
  await moveCursor(580, 420, 800); // Hover chain selectors
  await wait(1800);

  // Click Flip Chains
  setStatus('BRIDGE PROTOCOLS // WORMHOLE NTT · SUI BRIDGE · +400 PTS');
  await moveCursor(580, 360, 600); // Hover flip button
  await clickCursor();
  if (appWin && typeof appWin.flipBridgeChains === 'function') {
    appWin.flipBridgeChains();
  }
  await wait(1800);
  clearHighlight();

  // ----------------------------------------------------
  // SCENE 7: APP - DEEPBOOK V3 SPOT CLOB (23.5s - 28.5s)
  // ----------------------------------------------------
  setStatus('DEEPBOOK V3 CLOB // CENTRAL LIMIT ORDER BOOK');
  if (appDoc) {
    const spotTab = appDoc.querySelector('.nav-tab[data-view="spot"]');
    if (spotTab) {
      await moveCursor(345, 30, 700);
      await clickCursor();
      spotTab.click();
    }
  }

  // Zoom in on live chart and orderbook
  await setCamera(1.18, -40, -10, 0, 0, 850);
  highlightBox(1140, 160, 460, 520); // Highlight orderbook ladder
  await moveCursor(1260, 380, 800);
  await wait(3000);
  clearHighlight();

  // ----------------------------------------------------
  // SCENE 8: APP - DEEPBOOK PREDICT (28.5s - 34.0s)
  // ----------------------------------------------------
  setStatus('DEEPBOOK PREDICT // 1-5 MIN BINARY ROUNDS');
  if (appDoc) {
    const predTab = appDoc.querySelector('.nav-tab[data-view="predict"]') || appDoc.getElementById('btnSubPredict');
    if (predTab) {
      await moveCursor(440, 30, 700);
      await clickCursor();
      predTab.click();
    }
  }

  // Zoom onto Predict card & BUY UP button
  await setCamera(1.22, 180, -120, 0, 0, 850);
  await moveCursor(268, 768, 800); // Hover Buy UP button
  await wait(1200);
  await clickCursor(); // Simulate clicking Buy UP
  await wait(2200);

  // ----------------------------------------------------
  // SCENE 9: NATIVE TECHNICAL OUTRO (34.0s - 38.5s)
  // ----------------------------------------------------
  hideStatus();
  laserScanner.classList.remove('scanning');
  await setCamera(0.96, 0, 10, 0, 0, 900);
  virtualCursor.style.display = 'none';

  outroBar.classList.add('show');
  await wait(4500);

  return 'promo_director_finished';
};
</script>

</body>
</html>
